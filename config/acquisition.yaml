# V3.5 — Unattended Claude acquisition worker: every ceiling, budget, and
# window it obeys. Nothing here changes FIT/GAP thresholds (config/scoring.yaml)
# or specialist-call caps (config/limits.yaml) -- those stay frozen and are
# read unchanged by the existing V3.1/V3.2 scripts this worker calls.

# V3.8.1 -- which production flow scripts/run_daily.py runs.
#   discovery_only (DEFAULT, required for the scheduled timer): discover ->
#     cheap deterministic verification -> persist -> sync CANDIDATES to
#     Google Sheets -> STOP. Nothing below basic verification runs
#     automatically -- see config/discovery_only.yaml for every cap this
#     mode obeys, and scripts/discovery_worker.py for the flow itself.
#     Never calls acquisition_worker.py (this file's own
#     max_worker_runtime_seconds/outreach_worthy_ceiling/fresh-discovery
#     settings below are NOT read in this mode -- see
#     config/discovery_only.yaml's own, smaller, independent set).
#   full_pipeline: the complete, unchanged V3.5-V3.8 flow this file and
#     acquisition_worker.py have always described (FIT/GAP, buying
#     signals, contactability, ranking enrichment, specialist escalation,
#     contact identity, outreach drafting, QA, send-window planning,
#     READY_TO_SEND export) -- everything below this key is still exactly
#     what it always was, and remains fully callable, just never the
#     SCHEDULED timer's default. Run explicitly
#     (`python3 scripts/run_daily.py` with this set, or
#     `python3 scripts/acquisition_worker.py` directly) when you
#     deliberately want the full research pipeline for a specific lead or
#     backlog.
# Fails closed (infrastructure_failure, non-zero exit) on any other value --
# see scripts/run_daily.py: verify_workspace().
production_mode: discovery_only

# Outreach-worthy ceiling -- a CEILING, never a quota. The worker must stop
# discovering/researching fresh candidates once today's QUALIFIED +
# HIGH_PRIORITY count reaches this, but 1 excellent prospect on a slow day is
# a fully successful run. Never lower FIT/GAP/evidence/QA bars to reach it.
outreach_worthy_ceiling: 15

# Fresh-discovery research budget -- bounds how much of the day's run can go
# to "search for new businesses" rather than advancing already-pending leads,
# and stops Claude from being able to search indefinitely trying to reach the
# ceiling above.
max_fresh_market_cells_per_run: 3          # distinct SUB-NICHE x CITY cells explored per run
max_fresh_candidates_researched_per_run: 10  # new businesses taken through verification+ per run

# Wall-clock / per-call timeouts (seconds). The worker checks the overall
# deadline between units of work (per lead, per market cell) -- it will not
# start new work once past deadline, but an in-flight `claude -p` call is
# additionally hard-capped by its own per-call timeout as a backstop.
max_worker_runtime_seconds: 2700          # 45 minutes, whole acquisition phase
# V3.7: bumped again after 2026-09-02's second production pass observed TWO
# discovery calls land at exactly 240.1s and one contactability call at
# exactly 90.0s -- landing precisely on the cap on multiple real calls in one
# run indicates the cap itself was too tight for the actual work being asked
# (a multi-source WebSearch pass), not an occasional fluke. Combined with the
# new bounded single retry-on-timeout below, this trades a modest amount of
# worst-case per-call latency for materially fewer spurious per-lead/per-cell
# failures.
max_claude_call_seconds_research: 300     # business verification, buying signals, discovery, specialist calls
max_claude_call_seconds_short: 120        # contactability, franchise (narrower questions)

# V3.7: a real `claude -p` call that times out is retried exactly once (same
# timeout, no backoff needed since the cost is time not rate) before being
# recorded as a per-lead/per-cell failure -- never unbounded, never retried
# for any OTHER error type (an auth/invocation error won't be fixed by
# retrying blindly). One failure -- even after its retry -- must still never
# block the rest of the batch; this only reduces how often a single slow
# call turns into an avoidable failure at all.
reliability:
  retry_on_timeout: true
  max_timeout_retries: 1

# Cost circuit breaker, independent of the timeouts above. Passed straight to
# `claude -p --max-budget-usd`.
max_budget_usd_per_call: 1.00

# Same-day catch-up window (see scripts/catchup.py). The permanent production
# schedule (systemd/lead-engine-daily.timer) is unchanged by this file --
# these values only govern whether a same-day recovery run is eligible.
catchup_window:
  start: "12:00"
  end: "14:00"
  tz: "Asia/Karachi"
  days: ["Tue", "Wed", "Thu", "Fri"]

# Bounded fresh-discovery market rotation. Deliberately NOT "search all of
# the US" -- a fixed niche x city grid, rotated by day-of-year so coverage
# spreads out over time instead of hammering the same cells, and a cell
# already present in data/markets/ is skipped in favor of a new one. Cities
# are mid-size US metros chosen for strong local-search dependence (not
# saturated national-chain markets).
#
# V3.7: broadened from 5 to 8 niches (added foundation_repair, estate_law,
# moving_relocation) and switched scripts/acquisition_worker.py's
# pick_discovery_cells() from a plain nested niche x city loop (which
# concentrated an entire run inside ONE niche's contiguous block of cities --
# confirmed as the root cause of 2026-09-02's two production passes
# exploring almost nothing but family_law) to a tier-weighted, interleaved
# rotation: config/niches.yaml's `tier` field (already the V3.1 FIT
# niche_economics axis, not a new concept) sets how often a niche appears in
# the interleave cycle -- tier 1 (hvac/roofing/restoration/foundation_repair)
# most often, tier 2 (plumbing/family_law/estate_law/moving_relocation)
# less often -- while every listed niche still appears every rotation cycle
# (never fully excluded, per the explicit "do not reject a niche globally"
# rule). See docs/LEAD-ENGINE.md for the empirical analysis (niche tier,
# not review count/years-in-business, was the dominant correlate of low
# FIT scores in the production run that motivated this).
discovery_markets:
  niches: ["hvac", "roofing", "restoration", "foundation_repair", "plumbing", "family_law", "estate_law", "moving_relocation"]
  cities:
    - { city: "Columbus", state: "OH" }
    - { city: "Indianapolis", state: "IN" }
    - { city: "Kansas City", state: "MO" }
    - { city: "Louisville", state: "KY" }
    - { city: "Raleigh", state: "NC" }
    - { city: "Richmond", state: "VA" }
    - { city: "Tucson", state: "AZ" }
    - { city: "Omaha", state: "NE" }
    - { city: "Boise", state: "ID" }
    - { city: "Spokane", state: "WA" }
    - { city: "Chattanooga", state: "TN" }
    - { city: "Greenville", state: "SC" }

# Claude invocation parameters shared by every V3.5 research call
# (scripts/claude_invoke.py). --restricted + this allowlist is the structural
# enforcement of "no Gmail, no contact forms, no arbitrary writes": the
# invoked process has no tool capable of doing any of those, independent of
# what the prompt asks for.
claude_invocation:
  allowed_tools: ["Read", "WebSearch", "WebFetch"]
  permission_mode: "dontAsk"
  restricted: true
  output_format: "json"
  no_session_persistence: true
